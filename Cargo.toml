[package]
name = "ttsrs"
version = "0.1.1"
edition = "2021"

[dependencies]
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tiktoken-rs = "0.9"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
futures = "0.3"
indicatif = "0.18"
dialoguer = "0.12"
ratatui = "0.30"
crossterm = "0.29"
edtui = "0.11"
