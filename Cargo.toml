[package]
name = "ttsrs"
version = "0.1.3"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tiktoken-rs = "0.5"
clap = { version = "4.3", features = ["derive"] }
anyhow = "1.0"
futures = "0.3"
indicatif = "0.17"
dialoguer = "0.10"
hound = "3.5"
symphonia = { version = "0.5", features = ["flac", "wav", "mp3"] }
lame = { version = "0.1.3", optional = true }
bytes = "1.4"

[features]
default = ["mp3"]
mp3 = ["lame"]