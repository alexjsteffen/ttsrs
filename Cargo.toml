[package]
name = "ttsrs"
version = "0.1.3"
edition = "2021"

[dependencies]
reqwest = { version = "0.11", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tiktoken-rs = "0.5"
clap = { version = "4.3", features = ["derive"] }
anyhow = "1.0"
futures = "0.3"
indicatif = "0.17"
dialoguer = "0.10"
hound = "3.4"
symphonia = { version = "0.5", features = ["mp3", "flac", "wav", "pcm"] }
lame = "0.1.3"       # For MP3 encoding
flac = "0.2.0"       # For FLAC encoding