[package]
name = "ttsrs"
version = "0.1.1"
edition = "2021"
description = "A command-line tool for converting text to speech using OpenAI or ElevenLabs APIs"
license = "MIT"
repository = "https://github.com/alexjsteffen/ttsrs"
readme = "README.md"
keywords = ["tts", "text-to-speech", "openai", "elevenlabs", "cli"]
categories = ["command-line-utilities", "multimedia::audio"]

[dependencies]
ffmpeg-sidecar = "2.5.0"
reqwest = { version = "0.13", features = ["json", "stream"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = "0.4"
tiktoken-rs = "0.9"
clap = { version = "4.6", features = ["derive"] }
anyhow = "1.0"
futures = "0.3"
indicatif = "0.18"
dialoguer = "0.12"
ratatui = "0.30"
crossterm = "0.29"
edtui = "0.11"
