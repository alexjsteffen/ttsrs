name: CI

on:
     push:
          branches:
               - master

jobs:
     build:
          runs-on: ${{ matrix.os }}
          strategy:
               matrix:
                    include:
                         - os: ubuntu-latest
                           arch: x64
                         - os: ubuntu-22.04
                           arch: x64
                         - os: macos-latest
                           arch: arm64
                         - os: macos-14
                           arch: x64
                         - os: windows-latest
                           arch: x64

          steps:
               - name: Checkout code
                 uses: actions/checkout@v4

               - name: Install Rust
                 uses: dtolnay/rust-toolchain@stable

               - name: Build
                 run: cargo build --release

               - name: Import Code Signing Certificate (macOS)
                 if: runner.os == 'macOS'
                 env:
                      CERTIFICATE_BASE64: ${{ secrets.MACOS_CERTIFICATE }}
                      CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
                      KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
                 run: |
                      # Create variables
                      CERTIFICATE_PATH=$RUNNER_TEMP/build_certificate.p12
                      KEYCHAIN_PATH=$RUNNER_TEMP/app-signing.keychain-db

                      # Decode certificate from base64
                      echo "$CERTIFICATE_BASE64" | base64 --decode > $CERTIFICATE_PATH

                      # Create temporary keychain
                      security create-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH
                      security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
                      security unlock-keychain -p "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

                      # Import certificate to keychain
                      security import $CERTIFICATE_PATH -P "$CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k $KEYCHAIN_PATH
                      
                      # Add keychain to search list (including login keychain)
                      security list-keychain -d user -s $KEYCHAIN_PATH $(security list-keychains -d user | sed s/\"//g)

                      # Allow codesign to use the certificate
                      security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" $KEYCHAIN_PATH

               - name: Code Sign Binary (macOS)
                 if: runner.os == 'macOS'
                 run: |
                      # List available signing identities
                      echo "Available signing identities:"
                      security find-identity -v -p codesigning
                      
                      # Get the identity hash from the keychain
                      IDENTITY=$(security find-identity -v -p codesigning | grep "Developer" | head -1 | grep -o '[0-9A-F]\{40\}')
                      
                      if [ -z "$IDENTITY" ]; then
                        echo "Error: No code signing identity found"
                        exit 1
                      fi
                      
                      echo "Using identity: $IDENTITY"
                      
                      # Sign the binary
                      codesign --force --sign "$IDENTITY" --timestamp --options runtime target/release/ttsrs
                      
                      # Verify the signature
                      codesign --verify --verbose=4 target/release/ttsrs

               - name: Upload artifact
                 uses: actions/upload-artifact@v4
                 with:
                      name: ttsrs-${{ matrix.os }}-${{ matrix.arch }}
                      path: |
                           target/release/ttsrs
                           target/release/ttsrs.exe

               - name: Cleanup Keychain (macOS)
                 if: runner.os == 'macOS' && always()
                 run: |
                      security delete-keychain $RUNNER_TEMP/app-signing.keychain-db || true
